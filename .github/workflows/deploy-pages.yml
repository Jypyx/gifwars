name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a deployment in progress.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec oxlint . && pnpm exec eslint .

      - name: Unit tests
        run: pnpm test:unit --run

      - name: Type-check & build
        run: pnpm build
        env:
          GIFWARS_BASE_PATH: /${{ github.event.repository.name }}/

      # Pages has no SPA fallback: serve the app for deep links such as /gifwars/combat.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
