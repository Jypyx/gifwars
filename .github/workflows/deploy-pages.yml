name: Deploy GitHub Pages
run-name: Pages ← ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branche (ou tag / SHA) à déployer sur GitHub Pages
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      # Push sur main → ce commit ; lancement manuel → la branche saisie dans « Run workflow ».
      DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_REF }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build and verify the Pages artifact
        env:
          GIFWARS_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_PUSH_SUBSCRIBE_URL: ${{ vars.VITE_PUSH_SUBSCRIBE_URL }}
        run: |
          npm run build
          npm run --if-present verify:build -- "$GIFWARS_BASE_PATH"
      - name: Summary
        run: |
          {
            echo "### Déploiement GitHub Pages"
            echo "- Référence : \`$DEPLOY_REF\`"
            echo "- Commit : \`$(git rev-parse HEAD)\` — $(git log -1 --format=%s)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    # La définition du workflow doit venir de main (« Use workflow from: main ») ;
    # la branche réellement déployée est celle choisie dans l'entrée `ref`.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
